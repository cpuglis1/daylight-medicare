[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daylight-data"
version = "0.1.0"
description = "Versioned private 2026 evidence infrastructure; source acceptance remains external"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "psycopg[binary,pool]==3.3.6",
  "psycopg-pool==3.3.3", "boto3==1.43.122", "ijson==3.6.0", "jsonschema==4.25.1"
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
daylight-data = "daylight_data.cli:main"
daylight-comparisons = "daylight_data.comparison_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daylight_data.plan_types" = ["schema.sql", "runtime-requirements.lock"]
"daylight_data.csg_medigap" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
