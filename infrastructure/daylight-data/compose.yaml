# Isolated development only. No mount of either app's source or profile stores.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: daylight
      POSTGRES_USER: daylight_migration_owner
      POSTGRES_PASSWORD: ${DAYLIGHT_DATA_DB_PASSWORD:?Define a local development database password}
    ports:
      - "127.0.0.1:55485:5432"
    volumes:
      - postgres-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daylight_migration_owner -d daylight"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-test:
