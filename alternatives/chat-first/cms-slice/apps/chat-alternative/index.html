<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf9f4">
  <meta name="description" content="Daylight Medicare. Your coverage, plain as day. Understand Medicare and explore your coverage options at your pace.">
  <title>Daylight</title>
  <link rel="icon" type="image/svg+xml" href="/daylight.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/approved.css">
  <link rel="stylesheet" href="/ten.css">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/adaptive.css">
  <script src="/ten-state.js" defer></script>
  <script src="/readiness-core.js" defer></script>
  <script src="/adaptive-app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Daylight Medicare home">
      <img class="brand-mark" src="/daylight.svg" alt="" width="36" height="36">
      <span class="brand-name">Daylight<span class="brand-category">Medicare</span></span>
    </a>
  </header>
  <nav id="journey-map" class="journey-map" aria-label="Your journey" hidden></nav>
  <main id="main">
    <section id="landing" class="landing" aria-labelledby="landing-title">
      <div class="approved-hero">
        <div class="landing-inner">
          <h1 tabindex="-1" id="landing-title" class="landing-title">Your coverage,<br>plain as day</h1>
          <p class="landing-sub">Understand Medicare and explore your options, at your pace.</p>
          <div class="approved-entry-actions"><button id="get-started" class="primary-button landing-cta" type="button">Get started</button></div>
        </div>
        <figure class="approved-arrival-photo"><img src="/art/arrival-option-a.jpg" width="1400" height="933" fetchpriority="high" alt="A woman with short silver hair and an ochre cardigan facing the camera outdoors against green foliage."></figure>
      </div>
    </section>
    <section id="stage" class="stage" tabindex="-1" hidden></section>
  </main>
  <footer class="site-footer">
    <div id="guide-utilities"><button class="text-button" type="button" disabled>Your guide &amp; privacy</button></div>
    <p class="photo-credit">Photo: <a href="https://www.pexels.com/photo/woman-smiling-at-the-camera-6787568/" target="_blank" rel="noopener noreferrer">Marcus Aurelius / Pexels</a> · <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">License</a>. Illustrative, not a customer endorsement.</p>
  </footer>
  <template id="privacy-detail">
    <div class="privacy-copy">
      <p>Saving is optional and uses a protected guest cookie for this browser. Anyone sharing this browser may reopen a saved guide. Closing a tab does not delete it. Review or delete saved information using these controls.</p>
      <p>Original submitted text, unsent drafts and chat history are not stored. Readiness progress and unknown/deferred choices can be saved with the guide. Optional wording, dates, medicines, pharmacies and provider details stay in the tab unless you separately choose to save them.</p>
      <p>AI transfer needs separate permission. Only the submitted message and limited context are sent to OpenAI; previous sensitive values and the raw conversation are not automatically attached. This service does not log submitted chat. Production vendor, retention and deployment review remain separate.</p>
      <p>Progress shows conversation milestones, not verified eligibility. Plan records are five unvalidated 2027 Collier County, Florida samples. Personal recommendations, prices, provider or medicine fit, eligibility and enrollment remain subject to independent checks.</p>
    </div>
  </template>
  <noscript><p class="noscript-note">Please enable JavaScript to use Daylight Medicare.</p></noscript>
</body>
</html>
