:root{
  --font-ui:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,"Times New Roman",serif;
  font-family:var(--font-ui); font-size:18px; line-height:1.6; color:var(--ink);
  font-synthesis:none; -webkit-text-size-adjust:100%; font-variant-numeric:tabular-nums;
  --ink:#363b31; --ink-2:#63685b; --muted:#63685b; --ink-3:#9c9a8b;
  --paper:#fbf9f4; --paper-raised:#fffefa; --surface-2:#fffdf6;
  --line:#e4e0d4; --line-soft:#eeeadf;
  --accent:#4c5a46; --accent-strong:#3c4938; --sage:#edf0e5; --sage-border:#b7beaa; --sage-wash:#edf0e5;
  --gold:#b48a3d; --gold-ink:#876323;
  --sunlight:#edce80; --sunlight-hover:#e3bd60; --sunlight-border:#d3b25c;
  --sun-body:#ead08a; --ink-line:#4a4b3f;
  --focus:#6f7e54;
  --ok:#3d7a4e; --ok-bg:#e9f1e6; --now:#9a6a16; --now-bg:#faf0d7; --info:#8a6a2e; --info-bg:#f5ecdb; --wait:#6b7064; --wait-bg:#eeece3;
  --stamp-checked:#3d7a4e; --stamp-notyet:#7a776a;
  --r:12px; --r-card:16px; --r-lg:20px;
  --elev-1:0 1px 2px rgba(60,55,40,.05), 0 2px 8px rgba(60,55,40,.05);
  --elev-2:0 2px 6px rgba(60,55,40,.06), 0 8px 22px rgba(60,55,40,.08);
  --elev-3:0 12px 44px rgba(60,55,40,.16);
  --dur:250ms; --ease:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100svh;background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj4KICA8ZmlsdGVyIGlkPSJwYXBlciI+CiAgICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIyIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+CiAgICA8ZmVDb2xvck1hdHJpeCB0eXBlPSJzYXR1cmF0ZSIgdmFsdWVzPSIwIi8+CiAgICA8ZmVDb21wb25lbnRUcmFuc2Zlcj48ZmVGdW5jQSB0eXBlPSJsaW5lYXIiIHNsb3BlPSIwLjAzNSIvPjwvZmVDb21wb25lbnRUcmFuc2Zlcj4KICA8L2ZpbHRlcj4KICA8cmVjdCB3aWR0aD0iMTYwIiBoZWlnaHQ9IjE2MCIgZmlsdGVyPSJ1cmwoI3BhcGVyKSIvPgo8L3N2Zz4K'), radial-gradient(ellipse 80% 40% at 50% 0%, #f7ecd94d, transparent 75%);background-color:var(--paper);background-attachment:fixed,scroll}
button,input,textarea,select{font:inherit;color:inherit}
button,a,input,textarea,select,summary,label{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400;font-family:var(--font-display);font-optical-sizing:auto}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
h1:focus,[tabindex="-1"]:focus{outline:none}
.skip-link{position:absolute;top:-80px;left:16px;z-index:60;padding:12px 16px;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px}
.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------------------------------------------------------- buttons */
.primary-button{display:inline-flex;justify-content:center;align-items:center;gap:12px;background:var(--sunlight);color:#3a3326;border:1px solid var(--sunlight-border);border-radius:var(--r);min-height:56px;padding:14px 30px;font-size:18px;font-weight:700;box-shadow:0 2px 3px #5e4b1c08;transition:background var(--dur),box-shadow var(--dur),transform .05s}
.primary-button:hover{background:var(--sunlight-hover);box-shadow:0 4px 16px #8b713d1f}
.primary-button:active{transform:translateY(1px)}
.secondary-button{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:12px 22px;background:var(--paper-raised);color:var(--accent-strong);border:1px solid var(--sage-border);border-radius:var(--r);font-size:16px;font-weight:700;transition:background var(--dur)}
.secondary-button:hover{background:var(--sage)}
.text-button{border:0;background:transparent;color:var(--accent);font-size:15px;padding:10px 6px;min-height:44px;border-radius:7px;font-weight:600}
.text-button:hover{text-decoration:underline;text-underline-offset:4px}
.icon-button{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-2);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.icon-button:hover{background:var(--sage)}

/* ---------------------------------------------------------- top bar */
.site-header{display:flex;align-items:center;gap:20px;max-width:860px;margin:0 auto;min-height:84px;padding:0 28px}
.wordmark{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand-mark{display:block;width:36px;height:36px}
.brand-name{display:flex;flex-direction:column;font-family:var(--font-display);font-optical-sizing:auto;font-size:27px;line-height:1;font-weight:700;letter-spacing:-1px}
.brand-category{margin-top:6px;padding-left:2px;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.header-note{font-size:14px;color:var(--muted);margin-left:auto}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.ask-open-btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:9px 18px;border:1px solid var(--sage-border);border-radius:24px;background:var(--paper-raised);color:var(--accent-strong);font-size:15px;font-weight:700}
.ask-open-btn:hover{background:var(--sage)}
.ask-ico{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunlight);color:#3a3326;font-weight:800;font-size:13px}

/* ---------------------------------------------------------- journey map */
.journey-map{max-width:860px;margin:0 auto;padding:4px 28px 0}
.jmap-count{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--gold-ink);margin-bottom:8px}
.jmap-strip{list-style:none;display:flex;gap:6px;margin:0;padding:0 0 6px;overflow-x:auto;scrollbar-width:thin}
.jmap-stop{flex:1 1 0;min-width:96px}
.jmap-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-height:56px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-raised);text-align:left;position:relative;transition:background var(--dur),border-color var(--dur)}
.jmap-btn:disabled{opacity:.55}
.jmap-num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sage-wash);color:var(--accent-strong);font-size:13px;font-weight:700}
.jmap-name{font-size:12.5px;color:var(--ink-2);line-height:1.25}
.jmap-item{font-size:11px;color:var(--gold-ink);font-weight:700}
.jmap-stop.current .jmap-btn{border-color:var(--sunlight-border);background:#fdf6df;box-shadow:var(--elev-1)}
.jmap-stop.current .jmap-num{background:var(--now);color:#fff}
.jmap-stop.done .jmap-num{background:var(--ok);color:#fff}
.jmap-stop.locked .jmap-btn{background:transparent;border-style:dashed}

/* ---------------------------------------------------------- landing (locked to one screen) */
body.landing-mode{height:100svh;overflow:hidden;display:flex;flex-direction:column}
body.landing-mode .site-header{flex:0 0 auto}
body.landing-mode #main{flex:1 1 auto;min-height:0;display:flex}
body.landing-mode .landing{flex:1 1 auto;min-height:0}
body.landing-mode .site-footer{flex:0 0 auto}
.landing{min-height:calc(100svh - 160px);display:grid;place-items:center;padding:16px 28px;animation:rise var(--dur) var(--ease)}
.landing-inner{max-width:540px;text-align:center}
.landing-sun{display:block;width:68px;height:68px;margin:0 auto 16px}
.landing-eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold-ink);margin-bottom:12px}
.landing-title{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-1px;color:var(--ink);text-wrap:balance}
.landing-sub{font-size:18px;line-height:1.5;color:var(--muted);margin:14px auto 0;max-width:46ch}
.landing-points{list-style:none;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:26px 0 28px;padding:0}
.landing-points li{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--paper-raised);box-shadow:var(--elev-1);font-size:14.5px;font-weight:600;color:var(--ink)}
.lp-ico{color:var(--gold-ink);font-size:15px}
.landing-cta{min-height:58px;padding:16px 36px;font-size:19px}

/* ---------------------------------------------------------- stage */
#main{min-height:calc(100svh - 240px)}
.stage{max-width:600px;margin:0 auto;padding:30px 28px 40px;animation:rise var(--dur) var(--ease)}

/* bottom "Ask Daylight" invitation — opens the side panel */
.ask-bottom{margin:22px 0 10px}
.ask-bottom-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:16px 20px;border:1px dashed var(--sage-border);border-radius:var(--r-card);background:var(--surface-2);color:var(--accent-strong);text-align:left;font-size:15.5px;line-height:1.4;font-weight:600;transition:background var(--dur),border-color var(--dur)}
.ask-bottom-btn:hover{background:var(--sage);border-style:solid}
.ask-bottom-btn .abb-ico{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--sunlight);color:#3a3326;font-weight:800;font-size:17px}
.ask-bottom-btn .abb-sub{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.stage-head{margin-bottom:22px}
.stage-title{font-size:clamp(28px,4.4vw,40px);line-height:1.12;letter-spacing:-.8px;color:var(--ink)}
.stage-lede{font-size:18px;line-height:1.55;color:var(--muted);margin-top:14px;max-width:60ch}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------------------------------------------------------- cards */
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--elev-1);padding:22px 24px;margin:18px 0}
.card>h2{font-size:22px}
.card p{font-size:16.5px;line-height:1.6}
.card p+p{margin-top:12px}
.trust-card{background:#fdfbf4;border:1px solid var(--sage-border)}
.info-card{display:flex;flex-direction:column;gap:12px;background:var(--info-bg);border-color:#e3d3ac}
.warn-card{background:#fdf6df;border:1px solid #ecdcae}
.warn-title{font-size:19px;color:var(--gold-ink);margin-bottom:10px}

.idea-cards{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.idea-card{display:flex;gap:16px;align-items:flex-start;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;box-shadow:var(--elev-1)}
.idea-title{font-size:19px;color:var(--ink);margin-bottom:5px}
.idea-body{font-size:15.5px;line-height:1.55;color:var(--ink-2)}

/* foundation + three gaps */
.foundation{background:#faf7ee}
.foundation-eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink)}
.fdn-blocks{display:flex;gap:10px;margin:12px 0}
.fdn-block{flex:1;text-align:center;background:var(--sage);border:1px solid var(--sage-border);border-radius:10px;padding:14px;font-size:17px;font-weight:700;color:var(--accent-strong)}
.foundation-gaps-lede{font-size:15px;color:var(--ink-2);margin:6px 0 10px}
.gaps{display:flex;flex-direction:column;gap:9px}
.gap-slot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border:1.5px dashed var(--line);border-radius:10px;background:var(--paper)}
.gap-slot.filled{border-style:solid;border-color:var(--sage-border);background:var(--sage-wash)}
.gap-label{font-size:15.5px;font-weight:700;color:var(--ink)}
.gap-state{font-size:13px;color:var(--muted)}

/* ---------------------------------------------------------- question + choices */
.question{margin:26px 0 0}
.question-prompt{font-size:clamp(22px,3vw,26px);line-height:1.25;color:var(--ink)}
.question-note{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.5}
.choices{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:58px;padding:15px 22px;background:var(--paper-raised);border:1.5px solid var(--line);border-radius:14px;text-align:left;color:var(--ink);font-size:17px;line-height:1.35;transition:background var(--dur),border-color var(--dur),box-shadow var(--dur)}
.choice::after{content:"";width:21px;height:21px;flex:0 0 21px;border:2px solid var(--sage-border);border-radius:50%}
.choice.multi::after{border-radius:6px}
.choice:hover{background:var(--sage);border-color:var(--sage-border);box-shadow:var(--elev-1)}
.choice[aria-pressed="true"]{border-color:#7b8966;background:var(--sage)}
.choice[aria-pressed="true"]::after{background:#7b8966;border-color:#7b8966;box-shadow:inset 0 0 0 4px var(--sage)}
.question .primary-button{width:100%;margin-top:18px}
.month-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.month-row select{height:58px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-raised);padding:8px 14px;font-size:17px;color:var(--ink)}
.month-btns{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.month-btns .primary-button{width:100%}
.zip-input{display:block;width:100%;height:62px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper-raised);padding:10px 18px;letter-spacing:4px;font-size:24px;color:var(--accent-strong);margin-top:6px}
.field-error{font-size:14px;color:#8c3527;margin-top:8px;min-height:1em}

/* ---------------------------------------------------------- payoff + item */
.payoff{margin:20px 0 0;padding:20px 22px;background:#f4f6ee;border:1px solid var(--sage-border);border-radius:var(--r-card)}
.payoff-eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent-strong);margin-bottom:12px}
.payoff p{font-size:16.5px;line-height:1.6}
.payoff p+p,.payoff figure+p{margin-top:12px}
.payoff .visual{margin-top:14px}
.item-earned{display:flex;align-items:center;gap:9px;margin-top:18px;font-size:15px;font-weight:700;color:var(--gold-ink)}
.ie-ico{color:var(--gold)}
.continue-bar{margin-top:24px}
.continue-bar .primary-button{width:100%}
.mini-actions{margin-top:14px}
.mini-actions .secondary-button{width:100%}

/* ---------------------------------------------------------- Stop 5: paths, trade-offs */
.path-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;align-items:stretch}
.path-card{display:flex;flex-direction:column;background:var(--paper-raised);border:1.5px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--elev-1)}
.path-card.leaning{border-color:#7b8966;background:var(--sage);box-shadow:0 0 0 2px #dfe5d2}
.path-title{font-size:20px;color:var(--accent-strong);margin-bottom:12px}
.path-leanmark{margin-top:auto;padding-top:12px;font-size:14px;font-weight:700;color:var(--ok)}

/* build figure: how a path fills the three gaps */
.buildfig{flex:1}
.fdn-blocks{display:flex;gap:8px}
.buildfig .fdn-block{flex:1;text-align:center;background:var(--sage);border:1px solid var(--sage-border);border-radius:9px;padding:9px;font-size:14px;font-weight:700;color:var(--accent-strong)}
.buildfig-cap{font-size:11px;color:var(--muted);text-align:center;margin:5px 0 10px}
.buildfill{display:flex;flex-direction:column;gap:7px}
.fill-row{display:grid;grid-template-columns:16px 1fr;gap:4px 8px;align-items:baseline;font-size:13.5px;line-height:1.4}
.fill-plus{grid-row:span 2;color:var(--gold-ink);font-weight:800;font-size:15px;text-align:center}
.fill-gap{font-weight:700;color:var(--ink)}
.fill-how{grid-column:2;color:var(--ink-2)}
.buildfig-note{font-size:13px;line-height:1.5;color:var(--muted);margin-top:11px;padding:10px 12px;background:#faf8f1;border-radius:9px}

/* nuance chip: "it's more complicated, chat it out" */
.nuance-chip{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-top:12px;padding:12px 16px;border:1px dashed var(--sage-border);border-radius:12px;background:var(--surface-2);color:var(--accent-strong);text-align:left;font-size:14.5px;line-height:1.4;font-weight:600}
.nuance-chip:hover{background:var(--sage);border-style:solid}
.nc-ico{font-size:17px;flex-shrink:0}

/* AI-first "keep going" card on the wrap-up */
.next-card{border:1px solid var(--sunlight-border);background:#fdfbf4}
.next-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.next-actions>*{flex:0 0 auto}

/* landing fast-track link */
.landing-fast{display:inline-block;margin-top:14px;color:var(--muted);font-weight:600}
.landing-fast:hover{color:var(--accent)}
.path-note{font-size:15px;line-height:1.55;color:var(--ink);margin:4px 0 2px;padding:12px 16px;background:#faf8f1;border-radius:10px}
.tradeoff{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper-raised)}
.tradeoff-head{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:10px;padding:10px 14px;background:var(--sage);font-size:13px;color:var(--accent-strong)}
.tradeoff-row{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.5}
.tradeoff-row strong{color:var(--ink)}
.tradeoff-row span{color:var(--ink-2)}
.tradeoff-note{padding:4px 14px 12px;font-size:13px;color:var(--muted);font-style:italic}
.tradeoff-lede{margin-bottom:4px}
.tension{margin-top:14px;padding:14px 18px;background:var(--now-bg);border:1px solid #ecdcae;border-radius:12px;font-size:15px;line-height:1.55;color:var(--ink)}
.v5-details{margin-top:18px}
.v5-details>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--accent)}

/* ---------------------------------------------------------- Stop 6/7 plans */
.plans-lede{font-size:15.5px;line-height:1.6;color:var(--ink);margin:4px 0 14px;padding:14px 16px;background:var(--info-bg);border:1px solid #e3d3ac;border-radius:12px}
.plans-host{margin-top:6px}
.plans-subhead{font-size:20px;color:var(--ink);margin:22px 0 6px}
.medigap-section{margin-bottom:10px}
.shortlist{display:flex;flex-direction:column;gap:14px}
.rank-head{font-size:15px;line-height:1.6;color:var(--ink);padding:16px 18px;background:#fdf6df;border:1px solid #ecdcae;border-radius:12px;transform:rotate(-.4deg)}
.rank-head strong{color:var(--gold-ink)}
.pref-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chips-lead{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pref-chip{min-height:44px;padding:9px 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--paper-raised);color:var(--accent-strong);font-size:14px;font-weight:700}
.pref-chip:hover{background:var(--sage)}
.pref-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.catalog-warning{font-size:13.5px;line-height:1.6;color:#785c2d;background:#f6efdf;border:1px solid #e9dcbc;padding:12px;border-radius:10px}
.plan-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--elev-1);padding:18px;min-width:0}
.sl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sl-rank{display:grid;place-items:center;min-width:34px;height:28px;padding:0 9px;border-radius:14px;background:var(--sage);color:var(--accent-strong);font-size:14px;font-weight:700}
.plan-kind{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.plan-card h4{font-family:var(--font-display);font-optical-sizing:auto;font-weight:400;font-size:21px;line-height:1.25;margin:10px 0 4px;color:var(--ink)}
.plan-premium{margin:14px 0 12px;font-size:11px;color:var(--muted);line-height:1.5}
.plan-premium strong{display:block;font-size:25px;font-weight:700;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.plan-fields{display:grid;grid-template-columns:1.3fr 1fr;gap:7px 10px;border-top:1px solid var(--line);padding-top:12px;margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan-fields dd{margin:0;text-align:right;color:var(--ink)}
.plan-eligibility{margin-top:12px;padding:9px 11px;font-size:12px;background:#f6efdf;border-radius:6px;line-height:1.55;color:#806136}
.catalog-scope{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.catalog-scope>summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.catalog-scope p{margin-top:8px}
.plan-card .text-button{margin-top:10px}
.loading-text{color:var(--muted);font-size:15px}
.error-copy{color:#8c3527}

/* stamps / source tag */
.stamp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:2px solid currentColor;border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transform:rotate(-3deg);background:var(--paper-raised)}
.stamp-checked{color:var(--stamp-checked)}
.stamp-notyet{color:var(--stamp-notyet)}
.source-tag{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:8px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink-2)}
.source-tag .st-ico{color:var(--gold-ink)}
.source-tag a{font-weight:700}
.source-list{margin-top:8px}
.source-list>summary{cursor:pointer;font-size:12px;color:var(--muted);min-height:36px;display:flex;align-items:center}
.source-list a{display:block;font-size:12px;margin-top:6px;overflow-wrap:anywhere}

/* spots */
.spot{display:inline-block;width:52px;height:52px;line-height:0;flex-shrink:0}
.spot svg{display:block;width:100%;height:100%}
.spot .s-line{fill:none;stroke:var(--ink-line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spot .s-fill{fill:#f6e7c0;stroke:var(--ink-line);stroke-width:2.4;stroke-linejoin:round}
.spot .s-line-fill{fill:var(--paper-raised);stroke:var(--ink-line);stroke-width:2.2}
.spot .s-sun{fill:var(--sun-body)}
.spot .s-dash{fill:none;stroke:#7b8966;stroke-width:2.2;stroke-dasharray:3 3.5;stroke-linecap:round}

/* ---------------------------------------------------------- visuals V0-V8 */
.visual{margin:0;padding:0;border:0}
.visual-caption{font-size:13px;line-height:1.55;color:var(--muted);margin-top:11px}
.v-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.idea-cards{align-items:stretch}
.v-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.v-card strong{display:block;font-size:16px;color:var(--accent-strong);margin:0 0 8px}
.v-card p{font-size:14px;line-height:1.55;color:var(--muted)}
.v-card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.v-card li{font-size:14px;line-height:1.5;color:var(--ink)}
.v-ico{font-size:24px;line-height:1}
.v-bar-wrap{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.v-bar-lead{font-size:14.5px;color:var(--ink);margin-bottom:12px}
.v-bar{display:flex;height:60px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.v-bar-seg{display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.v-bar-seg span{display:flex;flex-direction:column;line-height:1.2;font-size:12px}
.v-bar-seg strong{font-size:17px}
.v-bar-medicare{background:var(--sage);color:var(--accent-strong)}
.v-bar-you{background:var(--sunlight);color:#3a3326}
.v-compare-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.v-compare{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper-raised)}
.v-compare th,.v-compare td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
.v-compare thead th{background:var(--sage);color:var(--accent-strong);font-weight:700;font-family:var(--font-display);font-size:15px}
.v-compare tbody th{font-weight:700;color:var(--ink);width:26%}
.v-compare td{color:var(--muted)}
.v-timeline{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-top:10px}
.v-timeline-list{list-style:none;margin:0;padding:0}
.v-tl-item{position:relative;display:grid;grid-template-columns:18px 1fr;gap:16px;padding-bottom:20px}
.v-tl-item::before{content:"";position:absolute;left:8px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.v-tl-item:last-child{padding-bottom:0}
.v-tl-item:last-child::before{display:none}
.v-tl-dot{width:16px;height:16px;border-radius:50%;background:var(--paper-raised);border:3px solid var(--sage-border);margin-top:3px}
.v-tl-now .v-tl-dot{border-color:var(--now);background:var(--now)}
.v-tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.v-tl-head strong{font-size:15.5px;color:var(--ink)}
.v-tl-when{font-size:14px;font-weight:700;color:var(--gold-ink)}
.v-tl-detail{font-size:14px;line-height:1.55;color:var(--muted);margin-top:4px}
.v-tl-badge{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--now);background:var(--now-bg);padding:3px 9px;border-radius:12px}
.v8-lead,.v8-note{font-size:14px;line-height:1.6;color:var(--muted)}
.v8-note{margin-top:12px}
.v8-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.v8-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.v8-letter{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--accent-strong)}

/* term chips + glossary */
.term-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.term-lead{font-size:13px;color:var(--muted)}
.term-chip{background:var(--sage);border:1px solid var(--sage-border);border-radius:18px;padding:8px 14px;min-height:40px;color:var(--accent-strong);font-size:13.5px;font-weight:700}
.term-chip:hover{background:#e3e8d7}
.term-chip::after{content:" ⓘ";font-size:11px;opacity:.6}
.glossary-dialog{border:0;border-radius:16px;padding:30px 32px;max-width:460px;width:calc(100vw - 40px);box-shadow:var(--elev-3);color:var(--ink)}
.glossary-dialog::backdrop{background:rgba(54,59,49,.38)}
.glossary-head{font-size:23px;color:var(--accent-strong)}
.glossary-def{font-size:17px;line-height:1.65;margin:16px 0 24px;color:var(--ink)}

/* ---------------------------------------------------------- Stop 7 final map + help */
.finalmap{background:var(--paper-raised)}
.finalmap-sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.finalmap-route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.finalmap-route li{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
.fm-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:700;border:2px solid var(--line);background:var(--paper)}
.fm-ico.is-done{color:#fff;background:var(--ok);border-color:var(--ok)}
.fm-ico.is-next{color:#fff;background:var(--now);border-color:var(--now)}
.fm-ico.is-info{color:var(--info);background:var(--info-bg);border-color:#dcc89a}
.finalmap-route strong{font-size:16.5px}
.finalmap-route p{font-size:14.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.finalmap-lean{margin-top:16px;font-size:15px}
.todo-list,.help-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.todo-list li{font-size:15.5px;line-height:1.55;padding-left:22px;position:relative}
.todo-list li::before{content:"□";position:absolute;left:0;color:var(--sage-border)}
.doctor-add{margin-top:16px}
.doctor-add label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}
.doc-input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper-raised);padding:8px 14px;font-size:16px}
.help-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.help-item strong{display:block;font-size:16px;color:var(--ink)}
.help-item>p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
.help-contacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px}
.help-tty{font-size:13px;color:var(--muted)}
.action-link{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:700}
.final-actions{margin-top:24px}
.final-actions .primary-button{width:100%}

/* ---------------------------------------------------------- footer */
.site-footer{max-width:860px;margin:0 auto;padding:24px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.site-footer details{text-align:right;max-width:520px}

/* D33–D37: one protected help surface, with a single reading scroll area. */
html{scrollbar-gutter:stable}
body.ask-active{overflow:hidden}
.ask-scrim{position:fixed;inset:0;background:var(--paper);z-index:50}
.ask-panel{position:fixed;inset:0 auto auto 50%;transform:translateX(-50%);z-index:51;width:min(860px,100%);height:100dvh;background:var(--paper-raised);box-shadow:var(--elev-3);display:flex;flex-direction:column;min-height:0}
.ask-head{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-shrink:0;padding:22px 36px 20px;border-bottom:1px solid var(--line)}
.ask-head>div{min-width:0}
.ask-title{font-size:28px;color:var(--accent-strong);line-height:1.3}
.ask-context{font-size:16px;color:var(--ink-2);line-height:1.4;margin-top:4px}
.ask-head .secondary-button{font-size:16px;line-height:1.3;min-height:48px;max-width:none;flex-shrink:0;text-align:center;white-space:nowrap}
.ask-reading{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-padding-block:24px;padding:24px 44px}
.ask-intro{font-size:18px;line-height:1.6;margin-bottom:24px;max-width:62ch}
.ask-thread{display:flex;flex-direction:column;gap:40px}
.ask-exchange+.ask-exchange{border-top:1px solid var(--line);padding-top:32px}
.ask-question{font:400 30px/1.3 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere;margin:0 0 14px;max-width:32ch;scroll-margin-top:24px}
.ask-who{font-size:14px;color:var(--ink-2);line-height:1.4;margin-bottom:8px}
.ask-text{font-size:18px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.ask-msg .action-link{font-size:16px;margin-top:12px;min-height:44px}
.ask-msg>.secondary-button{display:block;margin-top:16px}
.ask-msg .guide-picture{margin-top:24px}
.ask-canned{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;display:grid;gap:10px}

.ask-form{flex-shrink:0;border-top:1px solid var(--line);padding:16px 36px max(18px,env(safe-area-inset-bottom));background:var(--paper-raised)}

.ask-input-row{display:flex;gap:12px;align-items:flex-end}
.ask-input-row textarea{flex:1;min-width:0;resize:vertical;min-height:52px;max-height:120px;border:1.5px solid var(--sage-border);border-radius:10px;background:var(--paper-raised);padding:12px 14px;font-size:18px;line-height:1.4}
