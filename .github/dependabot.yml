version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    # infrastructure/daylight-data is left out (D149): its pins must move together
    # with plan_types/runtime-requirements.lock and the pilot data settings.
    # GitHub security updates still cover it.
    directories:
      - /tools/security
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Proposals only; dependency/engine locks still require deliberate review.
    insecure-external-code-execution: deny
