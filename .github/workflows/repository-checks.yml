name: Repository checks

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: Check all current files, including inherited publication debt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test the repository controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools/tests -v
      - name: Check the proposed Git snapshot and ownership
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_AUDIT: ${{ inputs.full_audit || false }}
        shell: bash
        run: |
          if [[ "$FULL_AUDIT" == "true" ]]; then
            python tools/baseline_checks.py --revision HEAD --full-audit
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            python tools/baseline_checks.py --revision HEAD --base "$BASE_SHA"
          else
            python tools/baseline_checks.py --revision HEAD --base HEAD^
          fi
