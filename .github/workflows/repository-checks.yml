name: Repository checks

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: Check all current files, including inherited publication debt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install the pinned JSON Schema validator used by the Claude adapter
        # Exact versions from infrastructure/daylight-data/requirements.lock.
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          jsonschema==4.25.1 jsonschema-specifications==2025.9.1 attrs==26.1.0
          referencing==0.37.0 rpds-py==2026.9.1 typing_extensions==4.16.0
      - name: Test the repository controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools/tests -v
      - name: Check the proposed Git snapshot and ownership
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_AUDIT: ${{ inputs.full_audit || false }}
        shell: bash
        run: |
          if [[ "$FULL_AUDIT" == "true" ]]; then
            python tools/baseline_checks.py --revision HEAD --full-audit
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            python tools/baseline_checks.py --revision HEAD --base "$BASE_SHA"
          else
            python tools/baseline_checks.py --revision HEAD --base HEAD^
          fi
      - name: Prepare exact development metadata and fictional journey
        run: python -B tools/prepare_advisor.py
      - name: Decide whether the advisor suite is needed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Pull requests touching only docs or repository config skip the ~13-minute
        # suite. Pushes, manual runs and anything else run it in full.
        run: python -B tools/advisor_tests_needed.py ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Check the public advisor with fictional inputs
        if: steps.scope.outputs.needed == 'true'
        run: python -B tools/run_advisor_checks.py
      - name: Check profile contracts and whole-offering safety with fictional records
        run: |
          python -B -m unittest discover -s infrastructure/daylight-data/tests -p test_profile_contract_export.py -v
          python -B -m unittest discover -s infrastructure/daylight-data/tests -p test_whole_offering.py -v
      - name: Launch the fixture advisor and check HTTP plus assets
        run: python -B tools/smoke_advisor.py
