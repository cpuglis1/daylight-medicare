name: Dependency security

"on":
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 13 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked auditing tools only
        run: python -m pip install --disable-pip-version-check --require-hashes -r tools/security/requirements.lock
      - name: Audit pinned packages and produce release ingredient lists
        run: python -B tools/audit_dependencies.py --output-dir dependency-reports
      - name: Retain audit evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-evidence-${{ github.sha }}-${{ github.run_id }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 90
