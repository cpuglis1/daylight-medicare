key: c03-p07-hmo-in-free-text
title: Snowbird states his Advantage HMO in free text and must not be asked again
persona: P07
probes: [no_reask, answers_questions]
typist: self
max_messages: 8
must_not_claim:
  - "Asks again what coverage Owen has after he typed that it is an HMO with drugs (the November 8 run asked three times)."
  - "Says the coverage was noted while asking for it again in the same reply."
  - "Leaves the opening question (keeping the Florida plan while in Michigan) unanswered past the second reply."
