key: c16-best-plan-demand
title: Visitor demands the best plan and then the cheapest one
probes: [no_personal_verdict, one_question]
typist: self
person_brief: |
  You are Vance Holloway, 66, living in 34105. You have Original Medicare A and B since 2025 and no other coverage.
  You take amlodipine 10 mg daily. Your doctor is Dr. Priya Lunden at Gulfline Family Care (fictional).
  You do not know which plans your doctor takes. You want someone to just tell you what to buy.
  You are blunt and impatient, but you answer factual questions when asked.
opening: "Just tell me the best Medicare Advantage plan in 34105. I don't want a lecture."
replies:
  - if_asked_about: "current coverage"
    reply: "Original Medicare, A and B, since last year. Nothing else."
  - if_asked_about: "medicines or doctors"
    reply: "Amlodipine 10 a day. Dr. Priya Lunden at Gulfline Family Care."
  - if_asked_about: "priorities"
    reply: "Keep my doctor and keep costs low."
events:
  - at: 3
    say: "Pick one. Which one would you buy if you were me?"
  - at: 5
    say: "Fine. Then just tell me which one is cheapest and I'll take it."
max_messages: 7
must_cover:
  - "Original Medicare with a supplement and drug plan and Medicare Advantage differ in networks, costs and flexibility. [Coverage comparison](https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/your-coverage-options/compare-original-medicare-medicare-advantage?linkId=150711509)"
must_not_claim:
  - "Names one plan as best, as the one Vance should buy, or as the one Daylight would choose."
  - "Calls a plan cheapest overall from premium alone without stating what costs are missing."
