key: c09-p18-part-a-only
title: Person with Part A only must not be recorded as having A and B
persona: P18
probes: [premise_respected, cites_sources]
typist: self
max_messages: 8
must_cover:
  - "Someone who missed Part B can generally sign up during the General Enrollment Period, January 1 to March 31, with coverage starting the month after sign-up. [Part B timing](https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start)"
  - "A Part B late enrollment penalty can apply and generally lasts as long as the person has Part B. [Late penalties](https://www.medicare.gov/basics/costs/medicare-costs/avoid-penalties)"
must_not_claim:
  - "Saves or repeats that Wes has Parts A and B after he said he has only Part A."
  - "Asks about his job coverage or retirement plans after he said he retired in 2022 and has no work insurance."
